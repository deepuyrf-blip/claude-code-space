[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
childlogdir=/tmp

[program:keymgr]
command=python3 /opt/keymgr/app.py
autorestart=true
startretries=99
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=KEYMGR_DATA_DIR="/home/agent/.claude",KEYMGR_PORT="8000",KEYMGR_PROXY_URL="http://127.0.0.1:8000/gw"

; IS_PLATFORM=true -> CloudCLI assumes external auth: no local "Create Account"
; step on every restart. (Protect the app with Caddy basic auth via CCW_PASS.)
[program:cloudcli]
command=cloudcli start --port 3001
directory=/home/agent/workspace
environment=IS_PLATFORM="true"
autorestart=true
startretries=99
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:caddy]
command=caddy run --config /home/agent/.caddy/Caddyfile --adapter caddyfile
autorestart=true
startretries=99
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
